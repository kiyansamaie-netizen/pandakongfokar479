name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Make the game fully offline (download libs and fonts)
        run: python3 scripts/localize.py
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow
      - run: python3 scripts/patch_android.py
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: castle-defense-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
