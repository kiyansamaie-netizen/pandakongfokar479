name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q castle-defense-apk.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - working-directory: castle-defense-apk
        run: |
          python3 scripts/localize.py
          pip install pillow
          npm install
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: castle-defense-apk/android/app/build/outputs/apk/debug/app-debug.apk
